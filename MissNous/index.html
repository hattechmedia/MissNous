    <title>Organic Water-Based Intimate Lubricant | Miss Nous</title>
    <meta name="description" content="Shop Miss Nous intimate lubricant made with organic botanicals. pH-balanced & non-sticky in pineapple & strawberry for ultimate comfort." />
    <!-- Dynamic Canonical Tag (matches exact current URL on every page) -->
    <link id="canonical-tag" rel="canonical" href="https://missnous.com/" />
    <script>
      (function() {
        try {
          var p = window.location.pathname.toLowerCase().replace(/\/+$/, '') || '';
          var s = window.location.search || '';
          var u = 'https://missnous.com' + (p === '' ? '/' : p) + s;
          var el = document.getElementById('canonical-tag');
          if (el) el.setAttribute('href', u);
        } catch(e) {}
      })();
    </script>
